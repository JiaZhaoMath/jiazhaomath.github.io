<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jia Zhao</title>
<meta name="description" content="Jia Zhao, Assistant Professor, Department of Mathematics, The University of Alabama.">
<link rel="canonical" href="https://jiazhaomath.github.io/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f8f8;
    --card: #ffffff;
    --ink: #1b2528;
    --muted: #5a6a6e;
    --accent: #0f5c6e;
    --accent-ink: #ffffff;
    --line: #dde4e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1517;
      --card: #172024;
      --ink: #e6eeef;
      --muted: #9aabaf;
      --accent: #4fb3c8;
      --accent-ink: #0b1316;
      --line: #263236;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px 32px;
    text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 2rem; font-weight: 650; letter-spacing: -0.01em; }
  h1 span { font-weight: 400; color: var(--muted); margin-left: 0.25em; }
  p { margin: 0; color: var(--muted); }
  .mail { margin-top: 12px; }
  .mail a { color: var(--accent); text-decoration: none; }
  .mail a:hover { text-decoration: underline; }
  nav { margin-top: 28px; display: grid; gap: 12px; }
  nav a {
    display: block;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--accent);
  }
  nav a.primary { background: var(--accent); color: var(--accent-ink); }
  nav a.secondary { color: var(--accent); }
  nav a:hover { filter: brightness(1.08); }
  nav a:focus-visible, .mail a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 420px) { main { padding: 32px 20px; } h1 { font-size: 1.7rem; } }
</style>
</head>
<body>
<main>
  <h1>Jia Zhao<span lang="zh">赵佳</span></h1>
  <p>Assistant Professor, Department of Mathematics</p>
  <p>The University of Alabama</p>
  <p class="mail"><a href="mailto:jia.zhao@ua.edu">jia.zhao@ua.edu</a></p>
  <nav>
    <a class="primary" href="https://scholar.google.com/citations?hl=en&amp;user=KcluNRsAAAAJ&amp;view_op=list_works&amp;sortby=pubdate">Publications on Google Scholar</a>
    <a class="secondary" href="https://sites.ua.edu/jzhao/">Faculty page at The University of Alabama</a>
  </nav>
</main>
</body>
</html>
